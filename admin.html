<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>予約管理</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;800&display=swap" rel="stylesheet">
  <script src="config.js"></script>
  <style>
    :root {
      --bg: #fff6f8;
      --surface: #fff;
      --text: #30252d;
      --sub: #6c5964;
      --line: #a74e72;
      --border: #ead7df;
      --danger: #b74b55;
      --radius: 12px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Noto Sans JP", "Yu Gothic", "Meiryo", sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; }
    .login {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
    }
    .login-box, .panel {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface);
    }
    .login-box {
      width: min(420px, 100%);
      padding: 28px;
    }
    .login-box h1 { margin: 0 0 8px; font-size: 24px; }
    .login-box p { margin: 0 0 18px; color: var(--sub); font-size: 14px; }
    .login-box input {
      width: 100%;
      height: 46px;
      padding: 0 12px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      margin-bottom: 12px;
    }
    .primary, .secondary, .danger {
      min-height: 38px;
      border-radius: var(--radius);
      border: 1px solid transparent;
      padding: 0 14px;
      font-weight: 800;
    }
    .primary { background: var(--line); color: #fff; }
    .secondary { background: #fff; border-color: var(--border); color: var(--text); }
    .danger { background: #fff0f1; border-color: #f0c6cb; color: var(--danger); }
    #dashboard { display: none; }
    .bar {
      position: sticky;
      top: 0;
      z-index: 3;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 20px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
    }
    .bar h1 { margin: 0; font-size: 18px; }
    .bar-actions { display: flex; gap: 8px; }
    .wrap {
      width: min(1180px, calc(100% - 28px));
      margin: 18px auto 40px;
    }
    .tabs { display: flex; gap: 8px; margin-bottom: 14px; }
    .tab {
      min-height: 40px;
      padding: 0 16px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: #fff;
      font-weight: 800;
    }
    .tab.is-active { border-color: var(--line); background: #fce7ef; color: #853253; }
    .panel { padding: 16px; overflow-x: auto; }
    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 14px;
    }
    .filters input, .filters select {
      height: 40px;
      padding: 0 10px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: #fff;
    }
    table { width: 100%; border-collapse: collapse; min-width: 860px; }
    th, td {
      padding: 10px;
      border-bottom: 1px solid var(--border);
      font-size: 13px;
      text-align: left;
      vertical-align: top;
      white-space: nowrap;
    }
    th { background: #f6f8f7; color: var(--sub); font-weight: 800; }
    .status { display: inline-flex; padding: 3px 8px; border-radius: 999px; background: #fce7ef; color: #853253; font-weight: 800; font-size: 12px; }
    .status.cancelled { background: #fff0f1; color: var(--danger); }
    .empty { padding: 36px; text-align: center; color: var(--sub); }
    .menu-actions { display: flex; justify-content: flex-end; gap: 8px; margin-bottom: 12px; }
    .menu-input {
      width: 100%;
      min-width: 110px;
      height: 36px;
      padding: 0 8px;
      border: 1px solid var(--border);
      border-radius: 6px;
    }
    textarea.menu-input { height: 58px; padding: 8px; resize: vertical; }
    .loader {
      position: fixed;
      inset: 0;
      display: none;
      place-items: center;
      background: rgba(255,255,255,0.78);
      z-index: 10;
      font-weight: 800;
    }
    @media (max-width: 720px) {
      .bar { align-items: flex-start; flex-direction: column; gap: 10px; }
      .bar-actions { width: 100%; }
      .bar-actions button { flex: 1; }
    }
  </style>
</head>
<body>
  <section class="login" id="loginView">
    <div class="login-box">
      <h1 data-config="STORE_NAME">予約管理</h1>
      <p>管理キーを入力してください</p>
      <input type="password" id="adminKey" placeholder="管理キー" autocomplete="current-password">
      <button class="primary" type="button" id="loginButton">ログイン</button>
      <p id="loginError" style="display:none;color:var(--danger);margin-top:12px;"></p>
    </div>
  </section>

  <section id="dashboard">
    <header class="bar">
      <h1><span data-config="STORE_NAME">予約管理</span> 管理画面</h1>
      <div class="bar-actions">
        <button class="secondary" type="button" id="registerNotificationButton">個人LINE通知を登録</button>
        <button class="secondary" type="button" id="refreshButton">更新</button>
        <button class="secondary" type="button" id="logoutButton">ログアウト</button>
      </div>
    </header>

    <main class="wrap">
      <p id="operationMessage" role="status" aria-live="polite"></p>
      <section id="cancelConfirmation" class="panel" style="display:none" aria-label="予約のキャンセル確認">
        <p id="cancelConfirmationText"></p>
        <button id="confirmCancelButton" type="button" class="danger">この予約をキャンセルする</button>
        <button id="dismissCancelButton" type="button" class="secondary">戻る</button>
      </section>
      <section class="panel" data-section="reservations">
        <div class="filters">
          <select id="statusFilter">
            <option value="active">有効な予約</option>
            <option value="cancelled">キャンセル</option>
            <option value="all">すべて</option>
          </select>
          <input type="date" id="dateFilter">
          <input type="search" id="searchInput" placeholder="名前・予約番号">
        </div>
        <table>
          <thead>
            <tr>
              <th>予約番号</th>
              <th>利用日</th>
              <th>時間</th>
              <th>メニュー</th>
              <th>お客様</th>
              <th>状態</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody id="reservationRows"></tbody>
        </table>
      </section>

    </main>
  </section>

  <div class="loader" id="loader">読み込み中...</div>
  <script src="api-client.js?v=20260907-errors"></script>
  <script src="admin.js?v=20260907-reconcile"></script>
</body>
</html>
